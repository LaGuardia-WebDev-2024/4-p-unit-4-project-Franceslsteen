<!DOCTYPE html>
<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap"
      rel="stylesheet"
    />
    <title>Unit 5 Project</title>
    <meta charset="utf-8" />
    <style>
      body {
        background-color: lightblue;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        font-family: "Marck Script", cursive;
      }

      .flip-card {
        background-color: transparent;
        width: 400px;
        height: 500px;
        perspective: 1000px;
        margin: auto;
      }

      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      }

      .flip-card:hover .flip-card-inner {
        transform: rotateY(180deg);
      }

      .flip-card-front,
      .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        font-size: 40px;
      }

      .flip-card-front {
        background-color: #bbb;
        color: black;
      }

      .flip-card-back {
        background-color: pink;
        color: #c20b7d;
        transform: rotateY(180deg);
      }
      #title {
        color: #c20b7d;
      }
      h1 {
        font-size: 50px;
        background-color: #bbe5f0;
      }
      h3 {
        font-size: 35px;
        background-color: #bbe5f0;
        width: 650px;
        margin: auto;
      }
      #gifts {
        font-size: 45px;
        color: #53241a;
        background-color: #f5e7ae;
        width: 200px;
        margin: auto;
      }
      .flexgive {
        display: flex;
        justify-content: center;
      }
      .flexgive img {
        background-color: #cc2d7f;
        margin: 40px;
        padding: 5px;
        font-size: 30px;
        text-align: center;
      }
      p {
        background-color: #e8c5eb;
      }
    </style>
  </head>
  <body>
    <span id="title">
      <h1>NO MORE COLLEGE WORK!</h1>
      <h3>You're invited to my college acceptance party</h3>
      <br />
      
    </span>
    <div class="flip-card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <img
            src="https://ih1.redbubble.net/image.3080497881.9505/fposter,small,wall_texture,product,750x1000.jpg"
    
            style="width: 400px; height: 500px; object-fit: cover"
          />
        </div>
        <div class="flip-card-back">
          <h1>College Acceptance Party</h1>
          <p>Location: Canes</p>
          <p>12/31/25</p>
          <p>Gifts very much required</p>
        </div>
      </div>
    </div>
    <br />

  </body>
</html>
